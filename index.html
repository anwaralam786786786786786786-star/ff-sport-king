<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b18"><title>FF SPORT KING</title><style>
:root{--bg:#070914;--card:#11152a;--card2:#171c36;--text:#f6f7ff;--muted:#9ba3c4;--p:#7c4dff;--p2:#00d4ff;--green:#23e39a;--red:#ff4d6d;--gold:#ffd45a;--line:#242a49}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#25205c 0,#0b0e1f 35%,#070914 75%);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif;min-height:100vh}button,input{font:inherit}.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:84px}.top{padding:20px 18px 10px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:10px;align-items:center}.logo{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,#8c4dff,#00c9ff);display:grid;place-items:center;font-size:24px;box-shadow:0 0 30px #6d42ff66}.brand b{font-size:19px;letter-spacing:.7px}.brand small{display:block;color:var(--muted)}.pill{border:1px solid var(--line);background:#11162c;color:#cbd2f4;padding:8px 11px;border-radius:14px;font-size:12px}.hero{margin:10px 16px 14px;padding:20px;border:1px solid #2d3560;border-radius:25px;background:linear-gradient(135deg,#201a4b,#101a34 60%,#0d2940);box-shadow:0 15px 50px #0008}.hero h1{margin:0 0 6px;font-size:30px}.hero p{margin:0;color:#bfc6e5}.cta{margin-top:18px;display:flex;gap:9px}.btn{border:0;border-radius:14px;padding:12px 15px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(90deg,var(--p),var(--p2));color:white;box-shadow:0 8px 25px #5e47ff55}.ghost{background:#ffffff0d;color:white;border:1px solid #ffffff18}.section{padding:0 16px;margin:18px 0}.section h2{font-size:17px;margin:0 0 10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat,.card{background:linear-gradient(180deg,#141932,#0f1327);border:1px solid var(--line);border-radius:18px}.stat{padding:14px 10px}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}.tour{padding:16px;margin-bottom:10px}.tour .row{display:flex;justify-content:space-between;gap:10px}.tag{display:inline-block;padding:5px 8px;border-radius:9px;background:#7c4dff22;color:#bca8ff;font-size:11px;font-weight:800}.tour h3{margin:10px 0 4px}.tour p{margin:0;color:var(--muted);font-size:13px}.money{color:var(--gold);font-weight:900}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:7px;background:#090b18ee;backdrop-filter:blur(16px);border-top:1px solid var(--line);z-index:5}.nav button{background:transparent;border:0;color:#7f87a9;padding:7px 3px;font-size:11px}.nav button.active{color:#fff}.nav i{display:block;font-style:normal;font-size:20px;margin-bottom:3px}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;z-index:10}.sheet{width:min(520px,100%);margin:auto;background:#10142a;border:1px solid #2a3154;border-radius:25px 25px 0 0;padding:20px;max-height:90vh;overflow:auto}.close{float:right;border:0;background:#ffffff10;color:#fff;border-radius:10px;padding:7px 10px}.qr{width:min(300px,85vw);display:block;margin:12px auto;border-radius:16px;background:white;padding:8px}.field{margin:12px 0}.field label{display:block;font-size:12px;color:#aab2d2;margin-bottom:6px}.field input{width:100%;padding:13px;border-radius:13px;border:1px solid #30385e;background:#090c1c;color:white;outline:none}.hidden{display:none!important}.login{padding:25px 18px}.phone{display:flex;gap:8px}.phone span{padding:13px;background:#171c36;border:1px solid #30385e;border-radius:13px;color:#cbd2f4}.msg{font-size:12px;color:#9fa8c9;margin-top:8px}.match{padding:14px;margin-bottom:9px}.empty{text-align:center;color:var(--muted);padding:30px}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#171c36;border:1px solid #394268;padding:11px 15px;border-radius:13px;display:none;z-index:20;font-size:13px}.danger{color:#ff8aa0}.success{color:#6ff0bd}
</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">♛</div><div><b>FF SPORT KING</b><small>PLAY • COMPETE • WIN</small></div></div><div id="userPill" class="pill">Guest</div></header><main id="view"></main><nav class="nav"><button data-page="home" class="active"><i>⌂</i>Home</button><button data-page="tournaments"><i>🏆</i>Tournaments</button><button data-page="matches"><i>🎮</i>Matches</button><button data-page="profile"><i>👤</i>Profile</button></nav></div><div id="modal" class="modal"><div class="sheet"><button class="close" onclick="closeModal()">✕</button><div id="modalBody"></div></div></div><div id="toast" class="toast"></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';
import {getAuth,onAuthStateChanged,RecaptchaVerifier,signInWithPhoneNumber,signOut} from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';
import {getFirestore,collection,addDoc,query,where,onSnapshot,serverTimestamp,doc,getDoc} from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';
import {firebaseConfig} from './firebase-config.js';
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);let user=null,confirmResult=null,recaptcha=null,current='home',tournaments=[];
const view=document.getElementById('view');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2600)}
function openModal(h){document.getElementById('modalBody').innerHTML=h;document.getElementById('modal').style.display='flex'}window.closeModal=()=>document.getElementById('modal').style.display='none';
function loginModal(){openModal(`<div class="login"><h2>📱 Mobile OTP Login</h2><p class="msg">अपने मोबाइल नंबर से लॉगिन करें। OTP Firebase के जरिए आएगा।</p><div class="field"><label>Mobile Number</label><div class="phone"><span>+91</span><input id="phone" inputmode="numeric" maxlength="10" placeholder="9876543210"></div></div><div id="recaptcha-container"></div><button class="btn primary" style="width:100%" id="sendOtp">Send OTP</button><div id="otpBox" class="hidden"><div class="field"><label>6-digit OTP</label><input id="otp" inputmode="numeric" maxlength="6" placeholder="Enter OTP"></div><button class="btn primary" style="width:100%" id="verifyOtp">Verify & Login</button></div></div>`);try{recaptcha=new RecaptchaVerifier(auth,'recaptcha-container',{size:'normal'});recaptcha.render()}catch(e){console.error(e)}document.getElementById('sendOtp').onclick=async()=>{let p=document.getElementById('phone').value.replace(/\D/g,'');if(p.length!==10)return toast('10 digit mobile number डालें');try{confirmResult=await signInWithPhoneNumber(auth,'+91'+p,recaptcha);document.getElementById('otpBox').classList.remove('hidden');toast('OTP भेज दिया गया')}catch(e){console.error(e);toast(e.message||'OTP भेजने में समस्या')}};document.getElementById('verifyOtp').onclick=async()=>{let o=document.getElementById('otp').value.trim();if(o.length<6)return toast('6 digit OTP डालें');try{await confirmResult.confirm(o);closeModal();toast('Login successful')}catch(e){toast('गलत OTP')}}}
function home(){view.innerHTML=`<section class="hero"><span class="tag">LIVE TOURNAMENT</span><h1>Free Fire Tournament</h1><p>Compete with players • Win rewards • Fast room updates</p><div class="cta"><button class="btn primary" onclick="showPage('tournaments')">JOIN TOURNAMENT</button><button class="btn ghost" onclick="payment()">ADD MONEY</button></div></section><section class="section"><div class="stats"><div class="stat"><b>${tournaments.length}</b><span>Open Tournaments</span></div><div class="stat"><b>4</b><span>My Matches</span></div><div class="stat"><b>₹0</b><span>Wallet</span></div></div></section><section class="section"><h2>🔥 Upcoming</h2>${tourHTML(tournaments.slice(0,3))}</section>`}
function tourHTML(arr){return arr.length?arr.map(t=>`<div class="card tour"><div class="row"><div><span class="tag">${esc(t.type||'Free Fire')}</span><h3>${esc(t.name||'Tournament')}</h3><p>${esc(t.date||'Date TBA')} • ${esc(t.time||'Time TBA')}</p></div><div style="text-align:right"><div class="money">₹${esc(t.prize||500)}</div><small style="color:#8f98b8">Prize</small></div></div><div class="row" style="margin-top:14px;align-items:center"><span class="msg">Entry ₹${esc(t.entry||50)} • ${esc(t.mode||'Squad')}</span><button class="btn primary" onclick='joinTour(${JSON.stringify(t)})'>JOIN</button></div></div>`).join(''):`<div class="empty">अभी कोई tournament नहीं है। Admin Firestore में tournament add कर सकता है।</div>`}
function tournamentsPage(){view.innerHTML=`<section class="section" style="margin-top:15px"><h2>🏆 All Tournaments</h2>${tourHTML(tournaments)}</section>`}
function matchesPage(){view.innerHTML=`<section class="section" style="margin-top:15px"><h2>🎮 My Matches</h2><div id="matchesList" class="empty">Loading...</div></section>`;if(!user){document.getElementById('matchesList').innerHTML='Login करके अपने matches देखें।';return}onSnapshot(query(collection(db,'matches'),where('playerId','==',user.uid)),s=>{let a=s.docs.map(d=>({id:d.id,...d.data()}));document.getElementById('matchesList').innerHTML=a.length?a.map(m=>`<div class="card match"><b>${esc(m.tournamentName||'Tournament')}</b><p class="msg">Status: <span class="success">${esc(m.status||'pending')}</span></p><p class="msg">Room ID: <b>${esc(m.roomId||'Hidden')}</b><br>Password: <b>${esc(m.roomPassword||'Hidden')}</b></p></div>`).join(''):'<div class="empty">No matches yet.</div>'})}
function profilePage(){view.innerHTML=`<section class="section" style="margin-top:15px"><div class="card" style="padding:20px"><h2>👤 Profile</h2><p class="msg">${user?esc(user.phone||user.uid):'Not logged in'}</p>${user?`<button class="btn ghost" onclick="logout()">Logout</button>`:`<button class="btn primary" onclick="loginModal()">Login with Mobile OTP</button>`}</div></section>`}
window.logout=async()=>{await signOut(auth);toast('Logged out')};window.payment=()=>{openModal(`<h2>💳 Add Money</h2><p class="msg">नीचे QR scan करके payment करें। Payment के बाद UTR submit करें।</p><img class="qr" src="./phonepe-qr.jpg"><div class="field"><label>Amount</label><input id="amt" type="number" placeholder="50"></div><div class="field"><label>UTR / Transaction ID</label><input id="utr" placeholder="Enter UTR"></div><button class="btn primary" style="width:100%" onclick="submitPayment()">Submit Payment</button>`)};
window.submitPayment=async()=>{if(!user)return loginModal();let amount=Number(document.getElementById('amt').value),utr=document.getElementById('utr').value.trim();if(!amount||!utr)return toast('Amount और UTR भरें');await addDoc(collection(db,'paymentRequests'),{playerId:user.uid,phone:user.phone||'',amount,utr,status:'pending',createdAt:serverTimestamp()});closeModal();toast('Payment request submitted')};
window.joinTour=t=>{if(!user)return loginModal();openModal(`<h2>🏆 ${esc(t.name||'Tournament')}</h2><p class="msg">Entry ₹${esc(t.entry||50)} • Prize ₹${esc(t.prize||500)}</p><div class="field"><label>Free Fire UID</label><input id="ffuid" inputmode="numeric" placeholder="Enter your UID"></div><div class="field"><label>Player Name</label><input id="pname" placeholder="In-game name"></div><button class="btn primary" style="width:100%" onclick='confirmJoin(${JSON.stringify(t)})'>Continue</button>`)};
window.confirmJoin=async t=>{let uid=document.getElementById('ffuid').value.trim(),name=document.getElementById('pname').value.trim();if(!uid||!name)return toast('UID और Player Name भरें');await addDoc(collection(db,'matches'),{playerId:user.uid,phone:user.phone||'',tournamentId:t.id||'',tournamentName:t.name||'',ffUid:uid,playerName:name,status:'payment_pending',roomId:'',roomPassword:'',createdAt:serverTimestamp()});closeModal();toast('Join request submitted')};
function showPage(p){current=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));({home,tournaments:tournamentsPage,matches:matchesPage,profile:profilePage}[p]||home)()};window.showPage=showPage;document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>showPage(b.dataset.page));
onAuthStateChanged(auth,u=>{user=u;document.getElementById('userPill').textContent=u?(u.phone||'Player'):'Guest';if(current==='profile')profilePage();});
try{onSnapshot(query(collection(db,'tournaments'),where('status','==','open')),s=>{tournaments=s.docs.map(d=>({id:d.id,...d.data()}));if(current==='home')home();if(current==='tournaments')tournamentsPage()})}catch(e){console.error(e)}
home();
</script></body></html>
