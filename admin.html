<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>FF SPORT KING Admin</title><style>body{font-family:system-ui;background:#080a16;color:#fff;padding:20px;max-width:700px;margin:auto}.c{background:#13172b;padding:18px;border-radius:16px;margin:12px 0}input,button{padding:12px;border-radius:10px;border:1px solid #30385e;background:#0a0d1d;color:#fff;margin:5px 0;width:100%}button{background:#704cff;font-weight:800}</style></head><body><h1>FF SPORT KING Admin</h1><p>यह basic Firestore admin helper है। Production में Firebase Security Rules से admin UID restrict करें।</p><div class="c"><h2>Add Tournament</h2><input id="name" placeholder="Tournament name"><input id="type" placeholder="Type e.g. Classic Squad"><input id="date" placeholder="Date"><input id="time" placeholder="Time"><input id="entry" type="number" placeholder="Entry"><input id="prize" type="number" placeholder="Prize"><input id="mode" placeholder="Mode"><button id="add">Add Open Tournament</button><p id="msg"></p></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import{getFirestore,collection,addDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';import{firebaseConfig}from'./firebase-config.js';const db=getFirestore(initializeApp(firebaseConfig));document.getElementById('add').onclick=async()=>{try{await addDoc(collection(db,'tournaments'),{name:name.value,type:type.value,date:date.value,time:time.value,entry:Number(entry.value||0),prize:Number(prize.value||0),mode:mode.value,status:'open',createdAt:serverTimestamp()});msg.textContent='Tournament added';}catch(e){msg.textContent=e.message}};</script></body></html>
